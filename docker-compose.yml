services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Credentials default to crate/crate for local use; override via the root .env to
    # rotate. Must stay in sync with DATABASE_URL below (same variables).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crate}
      POSTGRES_DB: ${POSTGRES_DB:-crate}
    # Host port 5438: 5432-5437 belong to Spotter/Plate/Cookbook/dragonfly-id/Magpie/Remnant
    # on this host (5436 is Magpie's — verified against `docker ps` at first deploy).
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crate} -d ${POSTGRES_DB:-crate}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./server/.env
    environment:
      # Reach Postgres over the compose network; overrides DATABASE_URL from .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crate}:${POSTGRES_PASSWORD:-crate}@db:5432/${POSTGRES_DB:-crate}
      # Deploy stamp surfaced by GET /version. deploy/redeploy.* exports these before
      # `compose up`; default to "unknown" for a plain manual `docker compose up`.
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
      # Suite SSO — public, non-secret values pinned here rather than only in .env: Compose
      # doesn't reload env_file content on `up`, so an env_file-only flag gets dropped when a
      # redeploy recreates the container without re-reading .env, silently 404ing /auth/suite.
      # Crate is SSO-only, so losing these would mean NO login path at all.
      SUITE_JWKS_URL: https://id.dragonflymedia.org/.well-known/jwks.json
      SUITE_ISSUER: https://id.dragonflymedia.org
      # ntfy (non-secret → pinned here, not env_file): sale events, buyer messages, price
      # drops, floor-reached prompts, eBay token-expiry warnings. Empty topic = all of it
      # silently off, which is what shipped: `${NTFY_TOPIC:-}` interpolates from a ROOT .env
      # and this repo has none, so the topic could never be anything but empty no matter what
      # was set. Literals here, per the §2 compose-env rule — the same class of silent config
      # loss that rule exists to prevent.
      #
      # The suite runs its own ntfy (C:\ntfy, host port 8095, tailnet-only) and the 2026-07-12
      # decision is that suite push uses it rather than ntfy.sh. That matters more here than
      # elsewhere: ntfy.sh topics are effectively public URLs, and these messages carry sale
      # amounts and buyer-related detail for an app deliberately kept off the public internet.
      # host.docker.internal is the host from inside this container, same hop as LM Studio.
      # Topic follows the suite's <domain>-alerts convention (dragonfly-/hawksnest-/magpie-).
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://host.docker.internal:8095}
      NTFY_TOPIC: ${NTFY_TOPIC:-crate-alerts}
      # LM Studio vision (item identification + condition + weight/dims). Non-secret and
      # required ⇒ pinned here. The config default is http://localhost:1234/v1, which is
      # correct only for bare-metal local dev: inside this container localhost is the
      # container, so scans would fail with a connect-refused 503 even when LM Studio is
      # running fine on the host. host.docker.internal is the host from in here.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_VISION_MODEL: ${LM_STUDIO_VISION_MODEL:-google/gemma-4-e4b}
    volumes:
      # Item photos (originals + cleaned) live on the host, not in the container — they must
      # survive redeploys. The DB stores paths only.
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
    # Published on localhost only. Host port 8007: 8000-8006 belong to
    # Spotter/Plate/posterizarr/Cookbook/dragonfly-id/Magpie/Remnant (8005 is Magpie's —
    # verified against `docker ps` at first deploy). Crate is tailnet-only — NO cloudflared
    # service, no `tunnel` profile: it is reached via Tailscale Serve on the host (it handles
    # buyer addresses and money; keep it off the public internet).
    ports:
      - "127.0.0.1:8007:8000"

volumes:
  pgdata:
  photos:
