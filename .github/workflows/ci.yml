name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Weekly bit-rot check (Mondays 08:00 UTC) so "green" stays meaningful between pushes.
    # Deploy is guarded against scheduled runs (see deploy.yml) so this never ships.
    - cron: "0 8 * * 1"

# Signed release publishing lives in release.yml (auto on main pushes that touch android/**).
# This workflow is server checks + Android tests + debug build for push/PR only.

# The Android jobs check the repo out into Crate/ and the sibling Pulse repo into Pulse/, so
# the composite build's includeBuild("../../Pulse") (relative to Crate/android) resolves inside
# the workspace. Pulse is public, so the default token suffices.

jobs:
  # ── Server ────────────────────────────────────────────────────────────────

  server-lint:
    name: "Server — Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.4.4
      - run: ruff check app
        working-directory: server
      - run: ruff format --check app
        working-directory: server

  server-test:
    name: "Server — Test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crate
          POSTGRES_PASSWORD: crate
          POSTGRES_DB: crate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://crate:crate@localhost:5432/crate_test
      SECRET_KEY: ci-test-secret-key-not-for-production
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest tests/ -v --tb=short

  # ── Android ───────────────────────────────────────────────────────────────

  android-test:
    name: "Android — Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Crate/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Crate
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.CRATE_SERVER_URL || 'https://dragonfly.tail2ce561.ts.net:8446/' }}" >> local.properties
      # Exclude Robolectric NATIVE-graphics screenshot tests from the gating job (they download a
      # large android-all runtime and can stall CI); they run on demand in the screenshots job.
      - run: ./gradlew :app:testDebugUnitTest --no-daemon -PexcludeScreenshots

  android-screenshots:
    name: "Android — UI Screenshots"
    runs-on: ubuntu-latest
    # Manual-only: the Robolectric native-graphics path is flaky on CI, so it doesn't gate
    # push/PR (or the auto-deploy). Run from the Actions tab to record/compare screenshots.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Crate/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Crate
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.CRATE_SERVER_URL || 'https://dragonfly.tail2ce561.ts.net:8446/' }}" >> local.properties
      - run: >-
          ./gradlew :app:testDebugUnitTest
          --tests "com.crate.screenshot.ScreenshotTest"
          --no-daemon -Proborazzi.test.compare=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-${{ github.sha }}
          path: |
            Crate/android/app/screenshots/**
            Crate/android/app/build/outputs/roborazzi/**
          retention-days: 30

  # ── Security / supply chain ───────────────────────────────────────────────

  secret-scan:
    name: "Secret scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so a secret in any past commit is caught
      # Exit 1 on any finding fails the job. --redact keeps the value out of the public log.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner

  dep-audit:
    name: "Dependency audit (pip-audit)"
    runs-on: ubuntu-latest
    # Weekly-only + advisory: never blocks a push/PR or the deploy (deploy is guarded against
    # scheduled runs). A red weekly run is the signal to look at advisories.
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip install -e .
      - run: pip-audit --desc

  android-build:
    name: "Android — Assemble Debug APK"
    runs-on: ubuntu-latest
    needs: android-test
    defaults:
      run:
        working-directory: Crate/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Crate
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.CRATE_SERVER_URL || 'https://dragonfly.tail2ce561.ts.net:8446/' }}" >> local.properties
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: crate-debug-${{ github.sha }}
          path: Crate/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
