name: Deploy

# Redeploys the self-hosted Crate server (Windows + Docker Desktop) on a
# self-hosted GitHub Actions runner. The runner long-polls GitHub *outbound*, so
# there are no inbound ports to open on the home network. Crate itself is
# tailnet-only (Tailscale Serve) — no cloudflared, no public hostname.
#
# Auto-deploy fires only after the CI workflow goes green on `main`
# (workflow_run), so a broken commit never ships. workflow_dispatch is a manual
# button that doubles as a rollback lever (pass a previous SHA in `ref`).
#
# Setup notes live in deploy/README.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to deploy (default: origin/main). Use a prior SHA to roll back."
        required: false
        default: "origin/main"
      bootstrap_host:
        description: "One-time host setup: create the deployment clone and a minimal server/.env if they don't exist yet."
        required: false
        type: boolean
        default: false

# Never let two deploys run at once; queue the second instead of colliding.
concurrency:
  group: crate-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Redeploy server
    # The `crate` label is assigned when the runner is registered on the host.
    runs-on: [self-hosted, crate]
    # Manual runs always proceed; automatic runs require a successful CI run on main
    # that was triggered by a push (NOT the weekly `schedule:` bit-rot run — that must
    # never ship a deploy).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      # No actions/checkout: we deploy the canonical clone on the host
      # (vars.CRATE_DIR), not the runner's ephemeral _work directory. That clone
      # owns the .env file and the pgdata/photos Docker volumes.
      #
      # shell: powershell is the built-in Windows PowerShell (5.1) — no PowerShell 7
      # (pwsh) install required on the host. GitHub context is passed via env (not
      # ${{ }} interpolated into code) so values can't break out of the script.
      # Opt-in, one-time, and strictly additive: it creates the deployment clone and a minimal
      # server/.env only when they are ABSENT. It never overwrites an existing .env — that file
      # holds real secrets and clobbering it would be unrecoverable. Off by default so the normal
      # deploy path has no hidden side effects.
      - name: Bootstrap host (one-time)
        if: inputs.bootstrap_host
        shell: powershell
        env:
          CRATE_DIR: ${{ vars.CRATE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = $env:CRATE_DIR
          if ([string]::IsNullOrWhiteSpace($dir)) {
            throw "CRATE_DIR Actions variable is not set. See deploy/README.md."
          }

          if (Test-Path (Join-Path $dir ".git")) {
            Write-Host "Deployment clone already present at $dir - leaving it as is."
          } else {
            $parent = Split-Path -Parent $dir
            if (-not (Test-Path $parent)) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
            Write-Host "Cloning CDRaab01/Crate into $dir ..."
            & git clone https://github.com/CDRaab01/Crate.git $dir
            if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          }

          # DATABASE_URL and the SSO pins come from docker-compose.yml's `environment:` block, so
          # SECRET_KEY is the only value the app actually needs to boot. Every other integration
          # (eBay, Shippo, Fernet, the deploy smoke) degrades to 503 while unset.
          $envPath = Join-Path $dir "server\.env"
          if (Test-Path $envPath) {
            Write-Host "server/.env already exists - leaving it untouched."
          } else {
            $bytes = New-Object byte[] 32
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $key = -join ($bytes | ForEach-Object { $_.ToString('x2') })
            # Written with LF endings: CRLF leaves a stray \r inside every parsed value.
            [System.IO.File]::WriteAllText($envPath, "SECRET_KEY=$key`n")
            Write-Host "Wrote a minimal server/.env with a freshly generated SECRET_KEY (value not logged)."
          }

          # Crate's host ports are a "verify these are still free" assumption, and the first
          # deploy found 8005/5436 already held by Magpie. Print the neighbours' port map so a
          # collision names the owner instead of surfacing as a bare "port is already allocated"
          # from deep inside compose. `docker ps` rather than netstat: Docker Desktop's proxy
          # does not show these binds as LISTENING, so netstat reports them free.
          Write-Host "--- containers publishing ports (Crate wants 8007 API / 5438 Postgres) ---"
          & docker ps --format "{{.Names}}  {{.Ports}}"

      - name: Redeploy
        shell: powershell
        env:
          CRATE_DIR: ${{ vars.CRATE_DIR }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CRATE_DIR)) {
            throw "CRATE_DIR Actions variable is not set. See deploy/README.md."
          }
          # CRATE_DIR pointing at a path that isn't the deployment clone otherwise fails
          # as a bare CommandNotFoundException on the `&` below, which reads like a broken
          # workflow rather than missing host setup. Name the actual gap instead.
          $script = Join-Path $env:CRATE_DIR "deploy\redeploy.ps1"
          if (-not (Test-Path $script)) {
            throw "No deployment clone at '$env:CRATE_DIR' ($script not found). One-time host setup: git clone https://github.com/CDRaab01/Crate.git '$env:CRATE_DIR', then create server/.env (see deploy/README.md for the required keys)."
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $ref = $env:INPUT_REF }
          else { $ref = $env:WORKFLOW_SHA }
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = 'origin/main' }
          Write-Host "Deploying ref: $ref"
          & $script -Ref $ref

      # Post-deploy synthetic smoke: proves SSO auth + DB read/write actually work against the
      # just-deployed server, not just that /health is up. Crate is SSO-only, so the smoke mints
      # an aud="suite" token via dragonfly-id's POST /smoke/token (CRATE_SMOKE_CLIENT_ID/SECRET
      # come from the deployed .env inside the container), trades it at /auth/suite, and exercises
      # an authenticated read. A non-zero exit fails the deploy run.
      - name: Post-deploy smoke
        shell: powershell
        env:
          CRATE_DIR: ${{ vars.CRATE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          $proj = $env:CRATE_DIR
          # Run the smoke INSIDE the server container (python is there; the runner has no host
          # python on PATH), hitting the app on its internal port 8000.
          docker compose -f "$proj\docker-compose.yml" cp "$proj\scripts\synthetic_smoke.py" server:/tmp/smoke.py
          if ($LASTEXITCODE -ne 0) { throw "copying smoke script into container failed" }
          docker compose -f "$proj\docker-compose.yml" exec -T -e CRATE_URL=http://localhost:8000 server python /tmp/smoke.py
          if ($LASTEXITCODE -ne 0) { throw "post-deploy smoke FAILED" }
